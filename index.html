  const w = nw * scale, h = nh * scale;
  return { x: (bw - w) / 2, y: (bh - h) / 2, w: w, h: h };
}
mqMobile.addEventListener('change', positionHotspots);
function positionHotspots() {
  const layer = $('hotspots');
  const sl = SLIDES[s];
  const hs = (sl && sl.hotspots) || [];
  const img = $('slide-img-' + activeLayer);
  if (!hs.length || !img.naturalWidth) { layer.style.display = 'none'; return; }
  const stage = $('stage');
  const r = fitRect(img.naturalWidth, img.naturalHeight, stage.clientWidth, stage.clientHeight);
  layer.style.display = 'block';
  layer.style.left = r.x + 'px'; layer.style.top = r.y + 'px';
  layer.style.width = r.w + 'px'; layer.style.height = r.h + 'px';
  layer.innerHTML = '';
  hs.forEach(h => {
    const a = document.createElement('a');
    a.className = 'hotspot';
    a.style.left = h.x + '%'; a.style.top = h.y + '%';
    a.style.width = h.w + '%'; a.style.height = h.h + '%';
    if (h.share) {
      a.href = '#';
      a.onclick = e => {
        e.preventDefault();
        e.stopPropagation();
        gaEvent('slide_cta_click', {
          slide_number: s + 1,
          button_name: 'share_story',
          story_name: 'frooti_story'
        });
        triggerShare();
      };
    } else {
      a.href = h.url || '#'; a.target = '_blank'; a.rel = 'noopener';
      a.onclick = e => {
        gaEvent('slide_cta_click', {
          slide_number: s + 1,
          button_name: 'clean_brands_whatsapp',
          story_name: 'frooti_story'
        });
        e.stopPropagation();
      };
    }
    layer.appendChild(a);
  });
}
window.addEventListener('resize', positionHotspots);

function render(dir, initial) {
  const sl = SLIDES[s];
  if (initial) {
    activeLayer = 'b';
    positionHotspots();
    trackSlideView();
  } else {
    showSlideImage(src(sl.img), dir || 0, sl.t || 'fade');
  }
  $('kbd-hint').classList.toggle('show', s === 0);
  $('tap-hint').classList.toggle('show', s === 0);
  $('prev').disabled = s === 0;
  $('next').disabled = s === N - 1;
  $('fill').style.width = ((s + 1) / N * 100) + '%';
  [...track.querySelectorAll('.dot')].forEach(d => {
    const i = +d.dataset.idx;
    d.classList.toggle('done', i < s);
    d.classList.toggle('now', i === s);
  });
}
function go(dir) { const n = s + dir; if (n >= 0 && n < N) { s = n; render(dir); } }
$('prev').onclick = e => { e.stopPropagation(); go(-1); };
$('next').onclick = e => { e.stopPropagation(); go(1); };
$('tap-l').onclick = () => go(-1);
$('tap-r').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});
let tx = null, ty = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  tx = null;
}, { passive: true });

// ---- share widget ----
const shareWidget = $('share-widget');
let copiedTimer = null;
function showCopied(msg) {
  const el = $('share-copied');
  el.textContent = msg || 'Link copied';
  el.classList.add('show');
  clearTimeout(copiedTimer);
  copiedTimer = setTimeout(() => el.classList.remove('show'), 1800);
}
function doShare(k) {
  gaEvent('share', { method: k, content_type: 'comic_story', item_id: 'frooti_story' });
  const u = location.href, eu = encodeURIComponent(u), et = encodeURIComponent(SHARE.title || document.title);
  if (k === 'copy') { if (navigator.clipboard) navigator.clipboard.writeText(u); showCopied(); return; }
  if (k === 'instagram') {
    if (navigator.clipboard) navigator.clipboard.writeText(u);
    showCopied('Link copied — paste into Instagram');
    window.open('https://www.instagram.com/', '_blank', 'noopener');
    return;
  }
  let url = '';
  if (k === 'linkedin') url = 'https://www.linkedin.com/sharing/share-offsite/?url=' + eu;
  else if (k === 'x') url = 'https://twitter.com/intent/tweet?url=' + eu + '&text=' + et;
  else if (k === 'whatsapp') url = 'https://wa.me/?text=' + et + '%20' + eu;
  else if (k === 'facebook') url = 'https://www.facebook.com/sharer/sharer.php?u=' + eu;
  if (url) window.open(url, '_blank', 'noopener');
}
[...shareWidget.querySelectorAll('#share-options button')].forEach(b => {
  b.onclick = e => { e.stopPropagation(); doShare(b.dataset.share); };
});
$('share-toggle').onclick = e => { e.stopPropagation(); shareWidget.classList.toggle('open'); };
// open ONLY when the yellow button itself is hovered; stay open while cursor is on the widget
$('share-toggle').addEventListener('mouseenter', () => shareWidget.classList.add('open'));
shareWidget.addEventListener('mouseleave', () => shareWidget.classList.remove('open'));
// a "Share button" hotspot (e.g. FORWARD THIS): try the native share sheet; if it's unavailable
// or blocked (desktop, or inside the builder preview iframe), fall back to the corner share menu
function triggerShare() {
  const openMenu = () => shareWidget.classList.add('open');
  if (navigator.share) {
    gaEvent('share', { method: 'native', content_type: 'comic_story', item_id: 'frooti_story' });
    try {
      const p = navigator.share({ title: SHARE.title || document.title, url: location.href });
      if (p && p.catch) p.catch(openMenu);
    } catch (e) { openMenu(); }
  } else {
    openMenu();
  }
}

render(0, true);
const firstSlideImage = $('slide-img-b');
let batchLoadingStarted = false;
function startBatchLoading() {
  if (batchLoadingStarted) return;
  batchLoadingStarted = true;
  preloadBatch(1);
}
function firstSlideReady() {
  if (slideRequestId === 0) setLoading(false);
  startBatchLoading();
}
if (firstSlideImage.complete && firstSlideImage.naturalWidth) firstSlideReady();
else {
  firstSlideImage.addEventListener('load', firstSlideReady, { once: true });
  firstSlideImage.addEventListener('error', firstSlideReady, { once: true });
}
</script>
